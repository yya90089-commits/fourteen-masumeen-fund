<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a35"><title>ثبت‌نام صندوق خانوادگی چهارده معصوم</title><style>
:root{--navy:#101a35;--gold:#d8b568;--gold2:#f3dfaa;--ink:#f7f2e7;--muted:#b9c1d2;--line:rgba(216,181,104,.25)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#25385d,#101a35 65%);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;padding:28px 16px}.wrap{max-width:560px;margin:5vh auto}.brand{text-align:center;margin-bottom:22px}.brand h1{color:var(--gold2);font-size:22px}.brand p,.hint{color:var(--muted);font-size:13px;line-height:2}.box{background:#182747;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 60px #0003}.box h2{color:var(--gold2);font-size:19px;margin-top:0}label{display:block;color:var(--gold2);font-size:13px;margin:13px 0}input{display:block;width:100%;margin-top:7px;padding:12px;border-radius:9px;border:1px solid var(--line);background:#101a35;color:white;font:inherit}button,.btn{display:inline-block;border:1px solid var(--gold);border-radius:10px;padding:12px 17px;background:var(--gold);color:#17213a;font:inherit;font-weight:bold;text-decoration:none;cursor:pointer}.secondary{background:transparent;color:var(--gold2)}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.warning{padding:12px;border:1px solid #b88b3f66;border-radius:10px;background:#d8b56812;color:#ead8aa;font-size:12px;line-height:2;margin:14px 0}.choice{display:block;padding:18px;margin:12px 0;border:1px solid var(--line);border-radius:13px;color:var(--gold2);text-decoration:none}.choice:hover{background:#ffffff0a}.choice small{display:block;color:var(--muted);margin-top:7px;line-height:1.8}#result{font-size:13px;color:var(--gold2);line-height:2}.back{color:var(--gold2);font-size:12px;text-decoration:none}
</style></head><body><main class="wrap"><div class="brand"><h1>صندوق خانوادگی چهارده معصوم</h1><p>سامانه حساب‌های کاربری</p></div><section class="box"><h2>ایجاد حساب عضو</h2><p class="hint">لطفاً اطلاعات حساب عضو را وارد کنید.</p><div class="warning">این فرم فعلاً پیش‌نمایش است و به سرور متصل نیست. رمز واقعی وارد نکنید؛ اطلاعات ثبت یا ذخیره نمی‌شود.</div><form onsubmit="return preview(event)"><label>نام و نام خانوادگی<input required maxlength="100" autocomplete="name" id="fullname"></label><label>نام کاربری<input required minlength="3" maxlength="40" autocomplete="username" id="username"></label><label>رمز عبور<input required minlength="8" type="password" autocomplete="new-password" id="password"></label><label>تکرار رمز عبور<input required minlength="8" type="password" autocomplete="new-password" id="confirm"></label><div class="row"><button type="submit">بررسی اطلاعات</button><a class="btn secondary" href="account.html">بازگشت</a></div></form><p id="result" role="status"></p></section><script>function preview(e){e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;document.getElementById('result').textContent=p!==c?'رمز عبور و تکرار آن یکسان نیستند.':'اطلاعات از نظر ظاهری کامل است؛ ثبت‌نام واقعی پس از اتصال سرور امن فعال می‌شود. هیچ اطلاعاتی ذخیره نشده است.';return false}</script></main></body></html>
